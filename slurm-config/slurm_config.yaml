    #SBATCH --job-name=evaluateGene

    #SBATCH -t 4:00:00

    #SBATCH --gres=gpu:1

    #SBATCH -G 1

    #SBATCH --mem 16G

    #SBATCH -c 12

    #SBATCH -N 1

