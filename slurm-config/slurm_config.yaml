gpu_selection: ""
llm_bash_script: '#!/bin/bash

    #SBATCH --job-name=llm_oper
    #SBATCH -t 8:00:00
    #SBATCH --mem 8G
    #SBATCH -c 2
    #SBATCH -N 1
    echo "Launching AIsurBL"
    hostname

    {}

    '

python_bash_script: '#!/bin/bash

    #SBATCH --job-name=evaluateGene
    #SBATCH -t 4:00:00
    #SBATCH --gres=gpu:1
    #SBATCH -G 1
    #SBATCH --mem 16G
    #SBATCH -c 12
    #SBATCH -N 1
    echo "Launching Python Evaluation"
    hostname

    module load cuda
    module load uv
    export CUDA_VISIBLE_DEVICES=0

    {}
    '
